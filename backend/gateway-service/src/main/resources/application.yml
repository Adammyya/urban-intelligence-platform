server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      routes:
        - id: auth-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/auth/**
        - id: sensor-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/sensors/**
          filters:
            - AuthenticationFilter

jwt:
  secret: ${JWT_SECRET}
